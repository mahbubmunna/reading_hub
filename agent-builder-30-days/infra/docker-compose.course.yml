# vLLM for the 30 day agent course.
# Lives in its own compose project so it never destabilises the voice-rag stack.
# Shares the host Hugging Face cache, so any model either project already
# downloaded is reused rather than pulled again.
#
#   cd ~/agent-course/infra
#   docker compose -f docker-compose.course.yml up -d
#   docker compose -f docker-compose.course.yml logs -f
#
# Port 8000 on the host. The voice-rag stack uses 8080, so both can be defined
# at once; see the VRAM note at the bottom before running both at the same time.

services:
  vllm-course:
    image: vllm/vllm-openai:latest
    container_name: vllm-course
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}                 # only needed for gated repos like Llama
      - VLLM_API_KEY=${VLLM_API_KEY:-local-dev-key}
      - PYTORCH_ALLOC_CONF=expandable_segments:True   # reduces allocator fragmentation
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      Qwen/Qwen2.5-7B-Instruct-AWQ
      --served-model-name local
      --max-model-len 16384
      --gpu-memory-utilization 0.80
      --max-num-seqs 16
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host                                 # vLLM needs host shared memory
    restart: unless-stopped
    healthcheck:
      # python3, not python. This image ships no `python` alias, so
      # ["CMD", "python", ...] fails every probe with
      #   exec: "python": executable file not found in $PATH
      # while the server serves traffic normally, and the container sits in
      # `starting` until it flips to `unhealthy`. Read the recorded probe
      # output rather than guessing:
      #   docker inspect --format '{{json .State.Health}}' vllm-course
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s                      # first start downloads weights

# ---------------------------------------------------------------------------
# The four flags that matter, and why
#
#   --enable-auto-tool-choice + --tool-call-parser
#       Without BOTH, the OpenAI-compatible endpoint never emits `tool_calls`.
#       The model describes the tool call in prose instead, your agent loop
#       sees nothing, and it looks exactly like your day 4 loop is broken.
#       Parser by model family:
#         Qwen2.5 / Qwen3      -> hermes
#         Llama 3.1 / 3.3      -> llama3_json
#         Mistral              -> mistral
#       Verify with the curl in 02-setup.md step A4 before writing any loop code.
#
#   --enable-prefix-caching
#       On by default in current vLLM, passed explicitly so day 2 is unambiguous.
#       Day 2 reads the hit rate off /metrics and then breaks it on purpose.
#
#   --max-model-len 16384
#       Week 2 grows agent history past 8k. vLLM REJECTS over-long requests
#       rather than truncating, so a small value shows up as errors mid-eval.
#
#   --served-model-name local
#       Your code always says model="local". Swapping models on day 13 is a
#       one line change here plus a restart, and zero changes in Python.
#
# If your model emits reasoning tags (Qwen3, DeepSeek-R1 distills), also add:
#       --reasoning-parser qwen3
#   or the <think> blocks land in message.content and pollute every agent turn,
#   every summary, and every eval score.
#
# ---------------------------------------------------------------------------
# If you get "CUDA out of memory" on startup
#
# The failure looks like this, during CUDA graph capture near the end of boot:
#
#   torch.OutOfMemoryError: CUDA out of memory. Tried to allocate 260.00 MiB.
#   GPU 0 has a total capacity of 15.47 GiB of which 67.69 MiB is free.
#   ... 352.00 MiB allocated in private pools (e.g., CUDA Graphs)
#
# Why: vLLM sizes its budget as a fraction of TOTAL GPU memory, fills the KV
# cache pool to that budget, and only THEN captures CUDA graphs. It also does
# not count the CUDA context or whatever your display server is holding,
# roughly 0.8 GiB on a desktop. At 0.90 there is nothing left for the graphs.
#
# Fix in this order, stopping when it boots:
#
#   1. Confirm nothing else is resident:  nvidia-smi
#      Stop the voice-rag stack if it is up. On a headless box you get ~0.8 GiB
#      back by not running a desktop session at all.
#   2. --gpu-memory-utilization 0.80   (set above; from 0.90)
#   3. --max-model-len 16384           (set above; from 32768)
#   4. --max-num-seqs 16               (set above; default 256 is far more
#                                       concurrency than one learner needs, and
#                                       it inflates activation and graph memory)
#   5. --enforce-eager                 (add it; skips CUDA graph capture
#                                       entirely, frees 1-2 GiB, costs perhaps
#                                       10-20% throughput. A good diagnostic:
#                                       if this fixes it, graphs were the cause)
#
# A 16384 context is not a downgrade for this course, it is a budget you have
# to respect. Set budget_tokens to about 12000 in the day 8 trimmer, leaving
# room for the response. Week 2 then teaches context discipline against a real
# wall instead of a theoretical one, which is the more useful lesson.
#
# ---------------------------------------------------------------------------
# VRAM on a 16 GB card
#
# Running the course stack ALONE (recommended): 0.80 as set above. Qwen2.5-7B
# AWQ weights are about 5.5 GB, leaving roughly 6 GB of KV cache, which is far
# more than a single-user course consumes.
#
# Running BOTH stacks at once: drop this service to 0.35 and --max-model-len
# 8192, and drop the voice-rag vllm to 0.35 as well.
# Both will work, both will be slower, and the course evals will be cramped.
# Simpler is to stop one stack while working on the other:
#
#   docker compose -f ~/voice-rag/docker-compose.yml stop vllm
#   docker compose -f docker-compose.course.yml up -d
#
# ---------------------------------------------------------------------------
# Model swaps for day 13's capability table: change the model name above, then
# `docker compose -f docker-compose.course.yml up -d --force-recreate`.
#
#   Weak tier    Qwen/Qwen2.5-3B-Instruct
#   Daily tier   Qwen/Qwen2.5-7B-Instruct-AWQ
#   Coding, wk1  Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
#   Already on   hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
#     disk         switch the parser to llama3_json for this one
#
# The model name is the ONLY thing that changes. Two notes on why:
#
#   There is no --quantization flag. vLLM reads the quantization scheme from the
#   model's own config.json and picks the fastest kernel that supports it. Naming
#   a scheme explicitly does not just describe the model, it OVERRIDES that
#   choice. `--quantization awq` on a card that supports awq_marlin gets you the
#   slow reference kernel and this line, easy to miss in a wall of boot logs:
#
#     Detected that the model can run with awq_marlin, however you specified
#     quantization=awq explicitly, so forcing awq. Use quantization=awq_marlin
#     for faster inference
#
#   Measured on an RTX 5060 Ti: roughly 6 tokens/s forced to awq, several times
#   that on auto-detection. Same model, same weights, same GPU.
#
#   The model is a POSITIONAL argument, not --model. vLLM deprecated --model and
#   removes it in v0.13.

# ---------------------------------------------------------------------------
# If the model answers with GARBLED TEXT (and so never calls a tool)
#
# Symptom, from the step A4 curl:
#
#   "To find 15% of 14,45 ... 1445 **0.15 ... is n is n is n0n10"
#   "tool_calls": []
#
# Read the prose, not the empty array. The model could not copy the number
# 12450 out of its own prompt and then degenerated into repeated tokens. That
# is broken inference, NOT a tool-parser problem. No parser can extract a call
# from a model in this state, so fix the quality first and only then re-judge
# the parser.
#
# Causes, in the order worth testing on a 16 GB Blackwell card (RTX 50xx, and
# note that sm_120 is newer than a lot of quantization kernels):
#
#   1. --kv-cache-dtype fp8    REMOVED above. This quantizes every stored key
#      and value to 8 bits. It buys KV cache headroom and costs accuracy, and
#      on a kernel/GPU combination that is not well tested it costs a lot more
#      than accuracy. Suspect it first: your voice-rag stack runs an AWQ model
#      on this same card without it and behaves.
#      CONFIRMED on an RTX 5060 Ti (sm_120): removing this flag alone, with no
#      other change, turned degenerate output into a clean tool call.
#
#   2. The AWQ kernel itself. Check which one vLLM picked:
#        docker compose -f docker-compose.course.yml logs vllm-course | grep -i -E "awq|marlin|quant"
#      "awq_marlin" is the good path. A plain "awq" fallback on a very new card
#      is where numerical garbage tends to live. Note that an explicit
#      --quantization flag can FORCE that fallback; see the model swap section.
#
#   3. Prove the GPU is fine by removing quantization from the equation:
#        Qwen/Qwen2.5-3B-Instruct   (drop --quantization awq entirely)
#      ~6 GB of bf16 weights, fits comfortably, uses ordinary well-trodden
#      kernels. If 3B is coherent and 7B-AWQ is not, the quantization path is
#      guilty and the card is not.
#
# Known-good alternatives once you have confirmed the cause:
#
#   RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic   --quantization fp8
#       FP8 is native on Blackwell, ~8 GB of weights. Usually the best 7B
#       option on this generation of card.
#   hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4   awq
#       Already on your disk and already proven on this GPU by voice-rag.
#       Switch --tool-call-parser to llama3_json when you use it.
#
# Re-run the step A4 curl after every change. The bar is not "it produced
# something", it is: coherent sentences, the digits 12450 reproduced exactly,
# and a populated tool_calls array.
